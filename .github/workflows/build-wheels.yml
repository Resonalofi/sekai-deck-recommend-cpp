name: Build wheels

on:
  workflow_call:
    inputs:
      python_build:
        description: cibuildwheel Python selector
        required: false
        type: string
        default: "cp31*"
      include_linux_x64_manylinux:
        description: Build Linux x86_64 manylinux wheels
        required: false
        type: boolean
        default: true
      include_linux_x64_musllinux:
        description: Build Linux x86_64 musllinux wheels
        required: false
        type: boolean
        default: false
      include_linux_arm64_manylinux:
        description: Build Linux aarch64 manylinux wheels
        required: false
        type: boolean
        default: false
      include_linux_arm64_musllinux:
        description: Build Linux aarch64 musllinux wheels
        required: false
        type: boolean
        default: false
      include_windows_x64:
        description: Build Windows x64 wheels
        required: false
        type: boolean
        default: true
      include_windows_arm64:
        description: Build the experimental native Windows arm64 wheel
        required: false
        type: boolean
        default: false
      include_macos_x64:
        description: Build macOS x86_64 wheels
        required: false
        type: boolean
        default: false
      include_macos_arm64:
        description: Build macOS arm64 wheels
        required: false
        type: boolean
        default: false

jobs:
  # ============================================================
  # Linux x86_64 manylinux
  # ============================================================
  linux_x64_many:
    name: Linux x64 manylinux
    runs-on: ubuntu-latest
    if: inputs.include_linux_x64_manylinux

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-manylinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x64-many
          path: wheelhouse/*.whl

  # ============================================================
  # Linux x86_64 musllinux
  # ============================================================
  linux_x64_musl:
    name: Linux x64 musllinux
    runs-on: ubuntu-latest
    if: inputs.include_linux_x64_musllinux
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x64-musl
          path: wheelhouse/*.whl

  # ============================================================
  # Linux arm64 manylinux
  # ============================================================
  linux_arm64_many:
    name: Linux arm64 manylinux
    runs-on: ubuntu-24.04-arm
    if: inputs.include_linux_arm64_manylinux

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-manylinux*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm64-many
          path: wheelhouse/*.whl

  # ============================================================
  # Linux arm64 musllinux
  # ============================================================
  linux_arm64_musl:
    name: Linux arm64 musllinux
    runs-on: ubuntu-24.04-arm
    if: inputs.include_linux_arm64_musllinux
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-musllinux*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm64-musl
          path: wheelhouse/*.whl

  # ============================================================
  # Windows x64
  # ============================================================
  windows_x64:
    name: Windows x64
    runs-on: windows-latest
    if: inputs.include_windows_x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_CMAKE_GENERATOR: "Ninja"
          CIBW_ENVIRONMENT_WINDOWS: >
            CC=clang-cl
            CXX=clang-cl
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: wheelhouse/*.whl

  # ============================================================
  # Windows arm64
  # ============================================================
  windows_arm64:
    name: Windows arm64
    runs-on: windows-11-arm
    if: inputs.include_windows_arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_CMAKE_GENERATOR: "Ninja"
          CIBW_ENVIRONMENT_WINDOWS: >
            CC=clang-cl
            CXX=clang-cl
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm64
          path: wheelhouse/*.whl

  # ============================================================
  # macOS x86_64
  # ============================================================
  macos_x64:
    name: macOS x64
    runs-on: macos-15-intel
    if: inputs.include_macos_x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-*"
          CIBW_ARCHS_MACOS: "x86_64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x64
          path: wheelhouse/*.whl

  # ============================================================
  # macOS arm64
  # ============================================================
  macos_arm64:
    name: macOS arm64
    runs-on: macos-15
    if: inputs.include_macos_arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ inputs.python_build }}-*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python {project}/tests/wheel_smoke.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl
